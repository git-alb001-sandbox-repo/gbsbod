title: Kontakt
fields:
  -
    handle: content
    field:
      type: markdown
      display: Intro-Text
      instructions: 'Text unter der H1 auf der Kontaktseite (z. B. einleitender Satz vor der Ansprechpartner-Liste)'
      localizable: true
      escape_markup: true
  -
    handle: vereinsname
    field:
      type: text
      display: Vereinsname
      instructions: 'Vollständiger Name des Vereins, z. B. "GBS-Bodensee e. V."'
  -
    handle: strasse
    field:
      type: text
      display: Straße
      instructions: 'Straße und Hausnummer der Geschäftsstelle'
  -
    handle: plz_ort
    field:
      type: text
      display: 'PLZ / Ort'
  -
    handle: vereinsregister
    field:
      type: text
      display: Vereinsregister
      instructions: 'z. B. "AG Freiburg, VR 702069"'
  -
    handle: erster_vorsitzender
    field:
      type: text
      display: Erster Vorsitzender
  -
    handle: zweiter_vorsitzender
    field:
      type: text
      display: Zweiter Vorsitzender
  -
    handle: dritter_vorsitzender
    field:
      type: text
      display: Dritter Vorsitzender
  -
    handle: email
    field:
      type: text
      display: 'Allgemeine E-Mail'
      instructions: 'Zentrale E-Mail-Adresse des Vereins, z. B. info@gbs-bodensee.de'
      input_type: email
  -
    handle: kontoinhaber
    field:
      type: text
      display: Kontoinhaber
  -
    handle: bank
    field:
      type: text
      display: Bank
  -
    handle: iban
    field:
      type: text
      display: IBAN
  -
    handle: ansprechpartner
    field:
      type: replicator
      display: Ansprechpartner
      instructions: 'Liste der Ansprechpartner:innen auf der Kontaktseite'
      add_row: 'Ansprechpartner:in hinzufügen'
      sets:
        ansprechpartner:
          display: Ansprechpartner:in
          fields:
            -
              handle: rolle
              field:
                type: text
                display: Rolle
                instructions: 'z. B. "1. Vorsitzender", "Hochschulgruppe"'
            -
              handle: name
              field:
                type: text
                display: Name
            -
              handle: email
              field:
                type: text
                display: E-Mail
                input_type: email
