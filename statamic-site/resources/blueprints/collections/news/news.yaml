title: News
fields:
  -
    handle: title
    field:
      type: text
      required: true
      display: Titel
  -
    handle: card_title
    field:
      type: text
      display: 'Karten-Titel'
      instructions: 'Optionaler verkürzter Titel für Karten in Übersichten. Migrationsvorgabe: redaktionell kürzen statt abschneiden, KEINE Dots (nie „Titel …"), keine Informationen, die der Teaser bereits enthält (z. B. Ortsangaben). Leer lassen = Original-Titel. Der Original-Titel bleibt auf der Detail-Seite.'
  -
    handle: date
    field:
      type: date
      required: true
      display: Datum
  -
    handle: teaser
    field:
      type: textarea
      display: Teaser
  -
    handle: bild
    field:
      type: assets
      display: Bild
      max_files: 1
      container: assets
  -
    handle: bild_position
    field:
      type: select
      display: 'Bildausschnitt'
      instructions: 'object-position für den 8:5-Beschnitt (Karte und Detail). „top" hält Köpfe/Plakat-Titel im Bild, „center" ist der Standard.'
      options:
        center: center (Standard)
        top: top
        bottom: bottom
      default: center
  -
    handle: content
    field:
      type: markdown
      display: Inhalt
