title: News
fields:
  -
    handle: title
    field:
      type: text
      required: true
      display: Titel
  -
    handle: card_title
    field:
      type: text
      display: 'Karten-Titel'
      instructions: 'Optionaler verkürzter Titel für Karten in Übersichten. Migrationsvorgabe: redaktionell kürzen statt abschneiden, KEINE Dots (nie „Titel …"), keine Informationen, die der Teaser bereits enthält (z. B. Ortsangaben). Leer lassen = Original-Titel. Der Original-Titel bleibt auf der Detail-Seite.'
  -
    handle: date
    field:
      type: date
      required: true
      display: Datum
  -
    handle: teaser
    field:
      type: textarea
      display: Teaser
  -
    handle: bild
    field:
      type: assets
      display: Bild
      max_files: 1
      container: assets
  -
    handle: content
    field:
      type: markdown
      display: Inhalt
