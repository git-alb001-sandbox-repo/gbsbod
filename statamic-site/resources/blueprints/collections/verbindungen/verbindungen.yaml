title: Verbindungen
fields:
  -
    handle: title
    field:
      type: text
      required: true
      display: Name
  -
    handle: order
    field:
      type: integer
      display: Reihenfolge
      instructions: 'Sortierreihenfolge im Logo-Raster (wie hbbk-bodensee.org, kleinere Zahl zuerst)'
  -
    handle: logo
    field:
      type: assets
      display: Logo
      max_files: 1
      container: assets
  -
    handle: link
    field:
      type: link
      display: Link (extern)
