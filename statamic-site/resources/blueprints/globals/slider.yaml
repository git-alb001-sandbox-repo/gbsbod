        handle: slides
        field:
          type: grid
          display: Slides
          mode: table
          min_rows: 1
          max_rows: 6
          add_row: Slide hinzufügen
          fields:
            -
              handle: titel
              field:
                type: text
                display: Titel
                width: 33
            -
              handle: text
