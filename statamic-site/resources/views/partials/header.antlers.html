<header class="site-header" id="site-header">
    <div class="container site-header-inner">
        <a href="{{ site:url }}" class="site-logo" aria-label="GBS-Bodensee – Startseite">
            <img src="/assets/gbs-bodensee-logo.svg" alt="gbs Bodensee" width="600" height="250">
        </a>

        <div class="site-header-nav-wrap">
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Menü öffnen">
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
            </button>

            <nav class="main-nav" id="main-nav" aria-label="Hauptmenü">
                <ul class="nav-list">
                    {{ nav:main }}
                        <li class="nav-item{{ if (is_current || is_parent) }} is-active{{ /if }}">
                            <a href="{{ url }}">{{ title }}</a>
                        </li>
                    {{ /nav:main }}
                </ul>

                <button class="search-toggle" type="button" aria-expanded="false"
                        aria-controls="site-search" aria-label="Suche öffnen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </nav>

            <a class="donate-button"
               href="https://www.paypal.com/de/donate/?hosted_button_id={{ spenden:paypal_button_id }}&amp;country.x=DE&amp;locale.x=de_DE"
               target="_blank" rel="noopener">Spenden</a>
        </div>
    </div>

    <div class="site-search" id="site-search" hidden>
        <div class="container site-search-inner">
            <form class="site-search-form" action="/suche" method="get" role="search">
                <label class="visually-hidden" for="site-search-input">Suchbegriff</label>
                <input id="site-search-input" type="search" name="q"
                       placeholder="Suchbegriff eingeben …" autocomplete="off">
                <button class="site-search-submit" type="submit" aria-label="Suchen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </form>
            <button class="site-search-close" type="button" aria-label="Suche schließen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
</header>
