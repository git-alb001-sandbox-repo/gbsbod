<header class="site-header" id="site-header">
    <div class="container site-header-inner">
        <a href="{{ site:url }}" class="site-logo" aria-label="GBS-Bodensee – Startseite">
            <img src="/assets/gbs-bodensee-logo-small.png" alt="gbs Bodensee" width="836" height="64">
        </a>

        <div class="site-header-nav-wrap">
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Menü öffnen">
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
            </button>

            <nav class="main-nav" id="main-nav" aria-label="Hauptmenü">
                <ul class="nav-list">
                    {{ nav:main }}
                        <li class="nav-item{{ if (is_current || is_parent) }} is-active{{ /if }}">
                            <a href="{{ url }}">{{ title }}</a>
                        </li>
                    {{ /nav:main }}
                </ul>
            </nav>

            <a class="donate-button"
               href="https://www.paypal.com/cgi-bin/webscr?cmd=_s-xclick&amp;hosted_button_id={{ spenden:paypal_button_id }}"
               target="_blank" rel="noopener">Spenden</a>
        </div>
    </div>
</header>
