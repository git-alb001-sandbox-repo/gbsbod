<article class="news-card">
    {{ if bild }}
        <a class="news-card-image" href="{{ url }}">
            <img src="{{ bild }}" alt="{{ title }}" loading="lazy"{{ if bild_position && bild_position != "center" }} style="object-position: {{ bild_position }};"{{ /if }}>
        </a>
    {{ else }}
        <a class="news-card-image" href="{{ url }}">
            <img src="/assets/news/platzhalter.svg" alt="" loading="lazy">
        </a>
    {{ /if }}
    <div class="news-card-body">
        <p class="news-card-date">{{ date format="d. M. Y" }}</p>
        <h3 class="news-card-title">
            <a href="{{ url }}">{{ if card_title }}{{ card_title }}{{ else }}{{ title }}{{ /if }}</a>
        </h3>
        {{ if teaser }}
            <p class="news-card-teaser">{{ if (teaser|ends_with:'.') }}{{ teaser }}{{ else }}{{ teaser }} &hellip;{{ /if }}</p>
        {{ /if }}
        <a class="news-card-more" href="{{ url }}">Weiterlesen</a>
    </div>
</article>
