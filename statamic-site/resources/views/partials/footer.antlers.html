<footer class="site-footer">

        <div class="site-footer-logo">
            <img src="/assets/gbs-bodensee-logo.svg" alt="gbs Bodensee" width="600" height="250">
        </div>

        <nav class="footer-nav" aria-label="Footer-Menü">

                {{ footer_links:links }}

                {{ /footer_links:links }}
            </ul>
        </nav>

        {{ partial:social-links }}
    </div>
</footer>
